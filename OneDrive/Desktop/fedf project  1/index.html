<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List (Pure CSS)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 My To-Do List</h1>
    
    <ul class="todo-list">
      <li>
        <label>
          <input type="checkbox">
          <span class="task">Finish FEDF project</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox">
          <span class="task">Revise DBMS</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox">
          <span class="task">Submit assignment</span>
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox">
          <span class="task">Evening walk</span>
        </label>
      </li>
    </ul>
    
    <p class="note">* Checkboxes are interactive, but tasks are pre-defined.</p>
  </div>
</body>
</html>
